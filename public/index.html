<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neurolook &mdash; Search</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/transmitter-tokens.css">
  <link rel="stylesheet" href="/css/transmitter-shared.css">
  <link rel="stylesheet" href="/css/search.css">
</head>
<body class="tm-page">
  <header class="tm-header">
    <div class="tm-header__brand">
      <a href="/index.html" class="tm-header__logo">
        <img src="/assets/logo/transmitter-logo.svg" alt="The Transmitter" height="24">
      </a>
      <span class="tm-header__prototype-badge">Prototype</span>
    </div>
    <nav class="tm-header__nav" aria-label="Primary">
      <a href="/index.html" class="tm-header__nav-link tm-header__nav-link--active">Search</a>
      <a href="/browse.html" class="tm-header__nav-link">Browse</a>
      <a href="/collection.html" class="tm-header__nav-link">
        My Collection
        <span class="tm-header__badge" id="collection-count" hidden></span>
      </a>
      <a href="/about.html" class="tm-header__nav-link">About</a>
    </nav>
  </header>

  <main class="tm-main">
    <section class="tm-hero">
      <div class="tm-hero__title-group">
        <h1 class="tm-hero__title">Neurolook</h1>
        <p class="tm-hero__subtitle" id="hero-subtitle">Search digitally reconstructed neurons</p>
      </div>

      <form class="tm-search-form" action="/browse.html" method="get">
        <div class="tm-search-form__bar-row">
          <label for="search-name-input" class="sr-only">Search by neuron name</label>
          <div class="tm-search-bar tm-search-bar--with-button">
            <img src="/assets/icons/search.svg" alt="" width="18" height="18">
            <input id="search-name-input" name="name" type="text" class="tm-search-bar__input"
                   placeholder="Search by neuron ID, or the exact species, cell type, brain region, or archive name&hellip;">
            <button type="submit" class="tm-search-bar__submit">Search</button>
          </div>
        </div>

        <fieldset class="tm-filters">
          <legend class="sr-only">Filter results</legend>

          <div class="tm-combobox" data-combobox="species">
            <button type="button" class="tm-filter tm-combobox__trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="tm-combobox__value">Species</span>
              <img class="tm-filter__chevron" src="/assets/icons/chevron.svg" alt="" width="5" height="9">
            </button>
            <div class="tm-combobox__panel" hidden>
              <input type="text" class="tm-combobox__search" placeholder="Search species…" aria-label="Search species" autocomplete="off">
              <ul class="tm-combobox__list" role="listbox" aria-label="Species"></ul>
            </div>
            <select name="species" class="tm-combobox__native" data-filter="species" tabindex="-1" aria-hidden="true">
              <option value="">Species</option>
            </select>
          </div>

          <div class="tm-combobox" data-combobox="brain_region">
            <button type="button" class="tm-filter tm-combobox__trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="tm-combobox__value">Brain Region</span>
              <img class="tm-filter__chevron" src="/assets/icons/chevron.svg" alt="" width="5" height="9">
            </button>
            <div class="tm-combobox__panel" hidden>
              <input type="text" class="tm-combobox__search" placeholder="Search brain region…" aria-label="Search brain region" autocomplete="off">
              <ul class="tm-combobox__list" role="listbox" aria-label="Brain region"></ul>
            </div>
            <select name="brain_region" class="tm-combobox__native" data-filter="brain_region" tabindex="-1" aria-hidden="true">
              <option value="">Brain Region</option>
            </select>
          </div>

          <div class="tm-combobox" data-combobox="cell_type">
            <button type="button" class="tm-filter tm-combobox__trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="tm-combobox__value">Cell Type</span>
              <img class="tm-filter__chevron" src="/assets/icons/chevron.svg" alt="" width="5" height="9">
            </button>
            <div class="tm-combobox__panel" hidden>
              <input type="text" class="tm-combobox__search" placeholder="Search cell type…" aria-label="Search cell type" autocomplete="off">
              <ul class="tm-combobox__list" role="listbox" aria-label="Cell type"></ul>
            </div>
            <select name="cell_type" class="tm-combobox__native" data-filter="cell_type" tabindex="-1" aria-hidden="true">
              <option value="">Cell Type</option>
            </select>
          </div>

          <div class="tm-combobox" data-combobox="archive">
            <button type="button" class="tm-filter tm-combobox__trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="tm-combobox__value">Archive / Lab</span>
              <img class="tm-filter__chevron" src="/assets/icons/chevron.svg" alt="" width="5" height="9">
            </button>
            <div class="tm-combobox__panel" hidden>
              <input type="text" class="tm-combobox__search" placeholder="Search archive…" aria-label="Search archive" autocomplete="off">
              <ul class="tm-combobox__list" role="listbox" aria-label="Archive / Lab"></ul>
            </div>
            <select name="archive" class="tm-combobox__native" data-filter="archive" tabindex="-1" aria-hidden="true">
              <option value="">Archive / Lab</option>
            </select>
          </div>
        </fieldset>
      </form>

      <button type="button" class="tm-hero__random-link" id="random-neuron-button">Or try a random neuron &rarr;</button>
    </section>

    <section class="tm-recently-viewed" id="recently-viewed-section" hidden>
      <h2 class="tm-recently-viewed__title">Recently viewed</h2>
      <div class="tm-recently-viewed__list" id="recently-viewed-list"></div>
    </section>

    <div id="error-banner" class="status-message status-message--error" role="alert" hidden></div>
  </main>

  <footer class="tm-footer">
    <p class="tm-footer__text">Powered by NeuroMorpho.Org, with data from research labs worldwide.</p>
    <div class="tm-footer__links">
      <a href="/about.html#citation-policy">Citation Policy</a>
      <a href="https://neuromorpho.org/useterm.jsp" target="_blank" rel="noopener">Terms of Use</a>
      <a href="#">Contact Support</a>
    </div>
  </footer>

  <script type="module" src="/js/search.js"></script>
</body>
</html>
